apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-example
  namespace: default
spec:
  refreshInterval: "15s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vault-secret-example    # This will automatically create a Secret named 'vault-secret-example'
    creationPolicy: Owner
  data:
  - secretKey: foo
    remoteRef:
      key: "secret"
      property: foo
